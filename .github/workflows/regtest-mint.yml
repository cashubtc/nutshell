name: regtest-mint

on:
  workflow_call:
    inputs:
      python-version:
        default: "3.12"
        type: string
      poetry-version:
        default: "2.3.2"
        type: string
      os-version:
        default: "ubuntu-latest"
        type: string
      mint-database:
        default: ""
        type: string
      backend-wallet-class:
        required: true
        type: string

permissions:
  contents: read

jobs:
  regtest-mint:
    runs-on: ${{ inputs.os-version }}
    # Spark's cold source build can take 90 minutes before the suite starts.
    timeout-minutes: ${{ inputs.backend-wallet-class == 'SparkL2Wallet' && 150 || 30 }}
    env:
      CASHU_REGTEST_DIR: ${{ github.workspace }}/regtest
    steps:
      - name: Start PostgreSQL service
        if: contains(inputs.mint-database, 'postgres')
        run: |
          docker run -d --name postgres -e POSTGRES_USER=cashu -e POSTGRES_PASSWORD=cashu -e POSTGRES_DB=cashu -p 5432:5432 postgres:latest
          until docker exec postgres pg_isready; do sleep 1; done

      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
          poetry-version: ${{ inputs.poetry-version }}

      - name: Setup Regtest
        timeout-minutes: ${{ inputs.backend-wallet-class == 'SparkL2Wallet' && 90 || 20 }}
        uses: ./.github/actions/setup-regtest
        with:
          backend-wallet-class: ${{ inputs.backend-wallet-class }}

      - name: Run direct Spark backend tests
        if: inputs.backend-wallet-class == 'SparkL2Wallet'
        timeout-minutes: 10
        run: make test-spark-backend-regtest

      - name: Run Tests
        timeout-minutes: ${{ inputs.backend-wallet-class == 'SparkL2Wallet' && 45 || 10 }}
        env:
          WALLET_NAME: test_wallet
          MINT_HOST: localhost
          MINT_PORT: 3337
          MINT_TEST_DATABASE: ${{ inputs.mint-database }}
          TOR: false
          MINT_BACKEND_BOLT11_SAT: ${{ inputs.backend-wallet-class }}
          # LndRestWallet
          MINT_LND_REST_ENDPOINT: https://localhost:8081/
          MINT_LND_REST_CERT: ./regtest/data/lnd-3/tls.cert
          MINT_LND_REST_MACAROON: ./regtest/data/lnd-3/data/chain/bitcoin/regtest/admin.macaroon
          # LndRPCWallet
          MINT_LND_RPC_ENDPOINT: localhost:10009
          MINT_LND_RPC_CERT: ./regtest/data/lnd-3/tls.cert
          MINT_LND_RPC_MACAROON: ./regtest/data/lnd-3/data/chain/bitcoin/regtest/admin.macaroon
          # CLNRestWallet
          MINT_CLNREST_URL: https://localhost:3010
          MINT_CLNREST_RUNE: ./regtest/data/clightning-2/rune
          MINT_CLNREST_CERT: ./regtest/data/clightning-2/regtest/ca.pem
        run: |
          sudo chmod -R 777 .
          if [ "$MINT_BACKEND_BOLT11_SAT" = "SparkL2Wallet" ]; then
            make test-spark-mint
          else
            make test-mint
          fi

      - name: Regtest failure diagnostics
        if: failure()
        working-directory: regtest
        env:
          COMPOSE_PROJECT_NAME: cashu
        run: |
          docker compose --profile "*" ps -a
          docker compose --profile "*" logs --tail=100

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
