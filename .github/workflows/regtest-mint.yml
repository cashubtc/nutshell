name: regtest-mint

on:
  workflow_call:
    inputs:
      python-version:
        default: "3.12"
        type: string
      poetry-version:
        default: "2.3.2"
        type: string
      os-version:
        default: "ubuntu-latest"
        type: string
      mint-database:
        default: ""
        type: string
      backend-wallet-class:
        required: true
        type: string

permissions:
  contents: read

env:
  # Prebuilt cashu-regtest stack (bitcoind, 3x LND, 3x CLN, LNbits). Pinned to
  # a tag whose docker-compose exposes the node ports on the host (3010, 3001,
  # 8081, 10009, 5001) with RPC ports consistent with its own scripts.
  REGTEST_IMAGE: ghcr.io/callebtc/cashu-regtest-environment:sha-bde3931fe27e32b8f83b2adbb65a8460c2f32ef5

jobs:
  regtest-mint:
    runs-on: ${{ inputs.os-version }}
    timeout-minutes: 20
    steps:
      - name: Start PostgreSQL service
        if: contains(inputs.mint-database, 'postgres')
        run: |
          docker run -d --name postgres -e POSTGRES_USER=cashu -e POSTGRES_PASSWORD=cashu -e POSTGRES_DB=cashu -p 5432:5432 postgres:latest
          until docker exec postgres pg_isready; do sleep 1; done

      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
          poetry-version: ${{ inputs.poetry-version }}

      - name: Setup Regtest
        run: |
          mkdir -p regtest/data
          # The container runs `docker compose` against the host daemon from
          # /regtest, so the stack's ./data bind mounts resolve to /regtest/data
          # on the runner. Point that at the workspace copy the tests read.
          sudo ln -sfn "$PWD/regtest" /regtest
          docker run -d --name regtest-environment \
            --network host \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/regtest/data:/regtest/data" \
            "$REGTEST_IMAGE"
          # The container entrypoint bootstraps the stack and runs its
          # acceptance checks; wait for them before running the tests.
          ready=false
          for i in $(seq 1 120); do
            if [ "$(docker inspect -f '{{.State.Status}}' regtest-environment)" != "running" ]; then
              break
            fi
            if docker logs regtest-environment 2>&1 | grep -q "all tests passed"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != "true" ]; then
            docker logs --tail 200 regtest-environment
            exit 1
          fi
          sudo chmod -R 777 regtest

      - name: Run Tests
        env:
          WALLET_NAME: test_wallet
          MINT_HOST: localhost
          MINT_PORT: 3337
          MINT_TEST_DATABASE: ${{ inputs.mint-database }}
          TOR: false
          MINT_BACKEND_BOLT11_SAT: ${{ inputs.backend-wallet-class }}
          # LndRestWallet
          MINT_LND_REST_ENDPOINT: https://localhost:8081/
          MINT_LND_REST_CERT: ./regtest/data/lnd-3/tls.cert
          MINT_LND_REST_MACAROON: ./regtest/data/lnd-3/data/chain/bitcoin/regtest/admin.macaroon
          # LndRPCWallet
          MINT_LND_RPC_ENDPOINT: localhost:10009
          MINT_LND_RPC_CERT: ./regtest/data/lnd-3/tls.cert
          MINT_LND_RPC_MACAROON: ./regtest/data/lnd-3/data/chain/bitcoin/regtest/admin.macaroon
          # CLNRestWallet
          MINT_CLNREST_URL: https://localhost:3010
          MINT_CLNREST_RUNE: ./regtest/data/clightning-2/rune
          MINT_CLNREST_CERT: ./regtest/data/clightning-2/regtest/ca.pem
        run: |
          sudo chmod -R 777 .
          make test-mint

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Stop Regtest
        if: always()
        run: |
          docker exec regtest-environment docker compose down --volumes || true
          docker rm -f regtest-environment || true
          sudo rm -f /regtest
