name: Pip package

on:
  push:
  pull_request:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install poetry==2.3.2
      - name: Verify versions
        if: github.event_name == 'release'
        run: python scripts/check_version.py "${{ github.event.release.tag_name }}"
      - run: poetry build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  install:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - run: python scripts/check_package.py dist

  publish:
    needs: [build, install]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install poetry==2.3.2
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - run: poetry publish -u __token__ -p "$PYPI_API_TOKEN"
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
