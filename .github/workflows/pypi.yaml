name: Pip package

on:
  push:
  pull_request:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
      - name: Verify versions
        if: github.event_name == 'release'
        run: python scripts/check_version.py "${{ github.event.release.tag_name }}"
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  install:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - run: python scripts/check_package.py dist

  publish:
    needs: [build, install]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
