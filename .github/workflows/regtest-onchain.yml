name: regtest-onchain

on:
  workflow_call:
    inputs:
      python-version:
        default: "3.12"
        type: string
      poetry-version:
        default: "2.3.2"
        type: string
      os-version:
        default: "ubuntu-latest"
        type: string

permissions:
  contents: read

env:
  REGTEST_REF: 7eb3515b9fb41f477f831cedd28e1ad9ae6c521d

jobs:
  regtest-onchain:
    runs-on: ${{ inputs.os-version }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
          poetry-version: ${{ inputs.poetry-version }}

      - name: Start Bitcoin Core regtest
        run: |
          git clone https://github.com/callebtc/cashu-regtest.git regtest
          git -C regtest checkout "$REGTEST_REF"
          docker compose -f regtest/docker-compose.yml config --format json > regtest/onchain-compose.json
          poetry run python - <<'PY'
          import json
          import shlex
          from pathlib import Path

          path = Path("regtest/onchain-compose.json")
          config = json.loads(path.read_text())
          command = config["services"]["bitcoind"]["command"]
          if isinstance(command, str):
              command = shlex.split(command)
          # BDK 0.32 expects the pre-28 RPC warning format.
          config["services"]["bitcoind"]["command"] = [*command, "-deprecatedrpc=warnings"]
          path.write_text(json.dumps(config))
          PY
          docker compose -f regtest/onchain-compose.json up -d bitcoind
          BITCOIND_CONTAINER=$(docker compose -f regtest/onchain-compose.json ps -q bitcoind)
          docker exec "$BITCOIND_CONTAINER" bitcoin-cli -regtest -rpcuser=cashu -rpcpassword=cashu -rpcwait getblockchaininfo
          BITCOIND_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$BITCOIND_CONTAINER")
          echo "ONCHAIN_REGTEST_RPC_URL=http://${BITCOIND_IP}:18443" >> "$GITHUB_ENV"

      - name: Run BDK onchain regtests
        env:
          ONCHAIN_REGTEST: "1"
        run: poetry run pytest tests/test_onchain_regtest.py -v

      - name: Show Bitcoin Core logs
        if: failure()
        run: docker compose -f regtest/onchain-compose.json logs bitcoind

      - name: Stop Bitcoin Core
        if: always()
        run: |
          if [ -f regtest/onchain-compose.json ]; then
            docker compose -f regtest/onchain-compose.json down --volumes
          fi
