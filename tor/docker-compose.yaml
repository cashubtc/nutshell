services:
  mint:
    image: cashubtc/nutshell:0.21.0
  #  build:
  #   context: ..
  #   dockerfile: Dockerfile
    container_name: mint
    ports:
      - "3338:3338"
    environment:
      - MINT_BACKEND_BOLT11_SAT=FakeWallet
      # - MINT_PRIVATE_KEY=YOU MUST SET YOUR OWN SECURE PRIVATE KEY. GENERATE WITH: openssl rand -hex 32
      - MINT_LISTEN_HOST=0.0.0.0
      - MINT_INPUT_FEE_PPK=0
      - MINT_LISTEN_PORT=3338
    # Invoke Python directly so this works with the pinned, older image too.
    command: ["python", "-c", "from cashu.mint.main import main; main()"]
  tor:
    build: .
    container_name: tor
    restart: unless-stopped
    volumes:
      - ./tor-data:/var/lib/tor/mint
      - ./torrc:/etc/tor/torrc
    depends_on:
      - mint
