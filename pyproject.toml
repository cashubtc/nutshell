[project]
name = "cashu"
version = "0.21.0"
description = "Ecash wallet and mint"
authors = [{ name = "calle", email = "callebtc@protonmail.com" }]
license = "MIT"
license-files = ["LICENSE.md"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    # SQLAlchemy 2.0.38+ leaves the test SQLite database unavailable after the
    # FastAPI test client shuts down. Keep the last verified compatible release
    # until the upstream regression is resolved.
    "SQLAlchemy[asyncio]>=2.0.37,<2.0.38",
    "greenlet>=3.5.6",
    "click>=8.5.0,<9.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "bech32>=1.2.0,<2.0.0",
    "fastapi>=0.115.14,<0.116.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "uvicorn>=0.31.0,<0.32.0",
    "loguru>=0.7.3,<0.8.0",
    "ecdsa>=0.19.2,<0.20.0",
    "bitstring>=3.1.9,<4.0.0",
    "h11>=0.14.0,<0.15.0",
    "cryptography>=43.0.3,<44.0.0",
    "websocket-client>=1.9.2,<2.0.0",
    "pycryptodomex>=3.23.0,<4.0.0",
    "setuptools>=75.9.1,<76.0.0",
    "wheel>=0.41.1,<0.42.0",
    "importlib-metadata>=6.11.0,<7.0.0",
    "httpx[socks]>=0.25.2,<0.26.0",
    "bip32>=4.0,<5.0",
    "coincurve>=20,<21",
    "mnemonic>=0.20,<0.21",
    "bolt11>=2.1.1,<3.0.0",
    "websockets>=12.0,<13.0",
    "slowapi>=0.1.10,<0.2.0",
    # The mint uses fixed-window-elastic-expiry, removed in limits 5.
    "limits>=4.8,<5",
    "cbor2>=5.9.0,<6.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "grpcio>=1.84.0,<2.0.0",
    "googleapis-common-protos>=1.75.3,<2.0.0",
    "mypy-protobuf>=3.7.0,<4.0.0",
    "types-protobuf>=5.29.1.20250403,<6.0.0.0",
    "grpcio-tools>=1.76.0,<2.0.0",
    "pyjwt>=2.14.0,<3.0.0",
    "redis>=5.3.1,<6.0.0",
    "brotli>=1.2.0,<2.0.0",
    "zstandard>=0.23.0,<0.24.0",
    "jinja2>=3.1.6,<4.0.0",
    "breez-sdk-spark>=0.17.2,<0.18.0",
]

[project.scripts]
mint = "cashu.mint.main:main"
cashu = "cashu.wallet.cli.cli:cli"
mint-cli = "cashu.mint.management_rpc.cli.cli:cli"

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=6.3.0,<7.0.0",
    "pytest>=8.4.2,<9.0.0",
    "fastapi-profiler>=1.5.0,<2.0.0",
    "respx>=0.21.1,<0.22.0",
    "ruff>=0.7.4,<0.8.0",
    "mypy>=1.20.2,<2.0.0",
    "pre-commit>=4.6.2,<5.0.0",
    "types-redis>=4.6.0,<5.0.0",
    "hypothesis>=6.168.0,<7.0.0",
    "mutmut>=3.8.0,<4.0.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "build_backend"
backend-path = ["scripts"]

[tool.uv.build-backend]
module-root = ""
source-include = ["requirements.txt", "package-files.txt", "scripts/build_backend.py"]
# Keep local build inputs and generated certificates out of distributions.
source-exclude = ["**/googleapis", "**/*.pem", "**/.DS_Store", "**/tor.pid"]

[tool.pytest.ini_options]
addopts = "--junitxml=junit.xml -o junit_family=legacy"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.mutmut]
source_paths = ["cashu/"]
# Each baseline and mutant imports fresh fixtures and resets its test databases.
# Do not fork a process that has already started gRPC or run the test suite.
process_isolation = "forkserver"
forkserver_warmup = "none"
pytest_add_cli_args_test_selection = ["tests/", "--ignore=tests/fuzz"]
pytest_add_cli_args = ["-o", "addopts=", "-x", "-q"]
do_not_mutate = [
    "cashu/lightning/lnd_grpc/protos/*",
    "cashu/mint/management_rpc/protos/*",
]
# Mutmut 3.6 drops grouping parentheses when removing this multiline `not`,
# producing invalid Python in cashu/lightning/blink.py.
do_not_mutate_patterns = ['not resp\.get']

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.lint]
# (`I`) means isorting
extend-select = ["I"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    "cashu/core/bolt11.py",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10
