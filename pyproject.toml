[tool.poetry]
name = "cashu"
version = "0.21.0"
description = "Ecash wallet and mint"
authors = ["calle <callebtc@protonmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
# SQLAlchemy 2.0.38+ leaves the test SQLite database unavailable after the
# FastAPI test client shuts down. Keep the last verified compatible release
# until the upstream regression is resolved.
SQLAlchemy = {version = ">=2.0.37,<2.0.38", extras = ["asyncio"]}
greenlet = ">=3.5.6"
click = "^8.5.0"
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
bech32 = "^1.2.0"
fastapi = "^0.115.14"
python-dotenv = "^1.2.3"
uvicorn = "^0.31.0"
loguru = "^0.7.3"
ecdsa = "^0.19.2"
bitstring = "^3.1.9"
h11 = "^0.14.0"
cryptography = "^43.0.3"
websocket-client = "^1.9.2"
pycryptodomex = "^3.23.0"
setuptools = "^75.9.1"
wheel = "^0.41.1"
importlib-metadata = "^6.11.0"
httpx = {extras = ["socks"], version = "^0.25.2"}
bip32 = "^4.0"
coincurve = ">=20,<21"
mnemonic = "^0.20"
bolt11 = ">=2.1.1,<3.0.0"
websockets = "^12.0"
slowapi = "^0.1.10"
# The mint uses fixed-window-elastic-expiry, removed in limits 5.
limits = ">=4.8,<5"
cbor2 = "^5.9.0"
asyncpg = "^0.30.0"
aiosqlite = "^0.20.0"
grpcio = "^1.84.0"
googleapis-common-protos = "^1.75.3"
mypy-protobuf = "^3.7.0"
types-protobuf = "^5.29.1.20250403"
grpcio-tools = "^1.76.0"
pyjwt = "^2.14.0"
redis = "^5.3.1"
brotli = "^1.2.0"
zstandard = "^0.23.0"
jinja2 = "^3.1.6"
breez-sdk-spark = "^0.17.2"
pyblst = "^0.3.1"

[tool.poetry.group.dev.dependencies]
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.3.0"
pytest = "^8.4.2"
fastapi-profiler = "^1.5.0"
respx = "^0.21.1"
ruff = "^0.7.4"
mypy = "^1.20.2"
pre-commit = "^4.6.2"
types-redis = "^4.6.0"
hypothesis = "^6.168.0"
mutmut = "^3.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--junitxml=junit.xml -o junit_family=legacy"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.mutmut]
source_paths = ["cashu/"]
pytest_add_cli_args_test_selection = ["tests/", "--ignore=tests/fuzz"]
pytest_add_cli_args = ["-o", "addopts=", "-x", "-q"]
do_not_mutate = [
    "cashu/lightning/lnd_grpc/protos/*",
    "cashu/mint/management_rpc/protos/*",
]
# Mutmut 3.6 drops grouping parentheses when removing this multiline `not`,
# producing invalid Python in cashu/lightning/blink.py.
do_not_mutate_patterns = ['not resp\.get']

[tool.poetry.scripts]
mint = "cashu.mint.main:main"
cashu = "cashu.wallet.cli.cli:cli"
mint-cli = "cashu.mint.management_rpc.cli.cli:cli"

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.lint]
# (`I`) means isorting
extend-select = ["I"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    "cashu/core/bolt11.py",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10
